name: Windows desktop instance regression

on:
  push:
    branches: [fix/windows-single-instance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-instance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test -p agent-hud-platform instance:: --locked -- --nocapture
      - run: cargo test -p agent-hud-host instance::tests --locked -- --nocapture
